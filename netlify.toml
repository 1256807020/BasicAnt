[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ── 生产环境变量 ─────────────────────────────────────────────
# 方式一：在 Netlify 后台 Site settings → Environment variables 配置（推荐）
#   VITE_API_BASE_URL = https://bw1vsfc5sd5i-production-82lvx7lm.us-central1.suga.run/api
#   VITE_WS_BASE_URL  = wss://bw1vsfc5sd5i-production-82lvx7lm.us-central1.suga.run
#
# 方式二：直接取消下面两行注释（Suga 后端地址为公开端点，无密钥）
# VITE_API_BASE_URL = "https://bw1vsfc5sd5i-production-82lvx7lm.us-central1.suga.run/api"
# VITE_WS_BASE_URL  = "wss://bw1vsfc5sd5i-production-82lvx7lm.us-central1.suga.run"
#
# 说明：
#   - REST 接口走 VITE_API_BASE_URL，直连 Suga 后端（CORS 已放开）
#   - WebSocket 走 VITE_WS_BASE_URL，直连 Suga 后端（纯静态托管无 /ws 代理）
#   - 两者都不配置时回退到同源 dev proxy，本地开发不受影响

# ── SPA 路由 fallback ────────────────────────────────────────
# 项目使用 BrowserRouter：直接访问 / 刷新深层路径（如 /login）时，
# Netlify 需将其回退到 index.html 由前端路由接管，否则 404。
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
